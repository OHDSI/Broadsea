version: '3.9'

services:

  # WebAPI 3.0. Broadsea's .env variable names are kept; they are mapped here
  # onto the Spring Boot 3 property names WebAPI 3.0 reads. Passwords come
  # from Docker secrets and are exported by webapi/docker-entrypoint.sh.
  ohdsi-webapi:
    container_name: ohdsi-webapi
    platform: ${DOCKER_ARCH}
    restart: unless-stopped
    ipc: none
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777
      - /var/lib/ohdsi/webapi/logs:uid=101,gid=101,mode=0755
    privileged: false
    volumes:
      - ${WEBAPI_CACERTS_FILE}:/tmp/cacerts
      - ${WEBAPI_ADDITIONAL_JDBC_FILE_PATH}:/var/lib/ohdsi/webapi/lib/additional/broadsea_mounted.jar
      - ../webapi/docker-entrypoint.sh:/entrypoint.sh
      - webapi-data:/data
    entrypoint: ["/bin/sh","/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/WebAPI/info || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    secrets:
      - WEBAPI_DATASOURCE_PASSWORD
      - SECURITY_LDAP_SYSTEM_PASSWORD
      - SECURITY_DB_DATASOURCE_PASSWORD
      - SECURITY_AD_SYSTEM_PASSWORD
      - SECURITY_OAUTH_GOOGLE_APISECRET
      - SECURITY_OAUTH_FACEBOOK_APISECRET
      - SECURITY_OAUTH_GITHUB_APISECRET
      - SECURITY_SAML_KEYMANAGER_STOREPASSWORD
      - SECURITY_SAML_KEYMANAGER_PASSWORDS_ARACHNENETWORK
      - SECURITY_JWT_SECRET
      - WEBAPI_CDM_SNOWFLAKE_PRIVATE_KEY
    environment:
      DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      DATASOURCE_URL: ${WEBAPI_DATASOURCE_URL}
      DATASOURCE_USERNAME: ${WEBAPI_DATASOURCE_USERNAME}
      DATASOURCE_OHDSI_SCHEMA: ${WEBAPI_DATASOURCE_OHDSI_SCHEMA}
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: ${WEBAPI_DATASOURCE_OHDSI_SCHEMA}
      SPRING_BATCH_REPOSITORY_TABLEPREFIX: ${WEBAPI_DATASOURCE_OHDSI_SCHEMA}.BATCH_

      # Flyway. Same history table and baseline as Broadsea's WebAPI 2.x setup,
      # so existing installs continue from their last 2.x migration and a fresh
      # broadsea-atlasdb (schema pre-built at 2.2.5) is baselined there.
      SPRING_FLYWAY_URL: ${WEBAPI_DATASOURCE_URL}
      SPRING_FLYWAY_USER: ${WEBAPI_DATASOURCE_USERNAME}
      SPRING_FLYWAY_SCHEMAS: ${WEBAPI_DATASOURCE_OHDSI_SCHEMA}
      SPRING_FLYWAY_PLACEHOLDERS_OHDSISCHEMA: ${WEBAPI_DATASOURCE_OHDSI_SCHEMA}
      SPRING_FLYWAY_TABLE: schema_history
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE}
      SPRING_FLYWAY_BASELINE_VERSION: "2.2.5.20180212152023"
      SPRING_FLYWAY_BASELINE_DESCRIPTION: Base Migration

      SECURITY_CORS_ENABLED: "true"
      SECURITY_CORS_ALLOWED_ORIGINS: "${HTTP_TYPE}://${BROADSEA_HOST}"
      SOLR_ENDPOINT: "${SOLR_VOCAB_ENDPOINT}"

      # trexsql plugin (DuckDB-backed cohort cache)
      TREXSQL_ENABLED: ${WEBAPI_TREXSQL_ENABLED}
      TREXSQL_CACHE_PATH: /data/cache
      HOME: /data

      # Security - which providers are enabled

      SECURITY_AUTH_DB_ENABLED: ${SECURITY_AUTH_JDBC_ENABLED}
      SECURITY_AUTH_LDAP_ENABLED: ${SECURITY_AUTH_LDAP_ENABLED}
      SECURITY_AUTH_AD_ENABLED: ${SECURITY_AUTH_AD_ENABLED}
      SECURITY_AUTH_KERBEROS_ENABLED: ${SECURITY_AUTH_KERBEROS_ENABLED}
      SECURITY_AUTH_OIDC_ENABLED: ${SECURITY_AUTH_OPENID_ENABLED}
      SECURITY_AUTH_OAUTH_GOOGLE_ENABLED: ${SECURITY_AUTH_GOOGLE_ENABLED}
      SECURITY_AUTH_OAUTH_FACEBOOK_ENABLED: ${SECURITY_AUTH_FACEBOOK_ENABLED}
      SECURITY_AUTH_OAUTH_GITHUB_ENABLED: ${SECURITY_AUTH_GITHUB_ENABLED}
      SECURITY_AUTH_CAS_ENABLED: ${SECURITY_AUTH_CAS_ENABLED}
      SECURITY_AUTH_GOOGLEIAP_ENABLED: ${SECURITY_AUTH_GOOGLEIAP_ENABLED}
      SECURITY_AUTH_GOOGLE_ACCESSTOKEN_ENABLED: ${SECURITY_GOOGLE_ACCESSTOKEN_ENABLED}
      SECURITY_AUTH_WINDOWS_ENABLED: "false"

      # Security - database login (reads <schema>.auth_user)

      SECURITY_AUTH_DB_DATASOURCE_DRIVER_CLASS_NAME: ${SECURITY_DB_DATASOURCE_DRIVERCLASSNAME}
      SECURITY_AUTH_DB_DATASOURCE_URL: ${SECURITY_DB_DATASOURCE_URL}
      SECURITY_AUTH_DB_DATASOURCE_USERNAME: ${SECURITY_DB_DATASOURCE_USERNAME}
      SECURITY_AUTH_DB_DATASOURCE_SCHEMA: ${SECURITY_DB_DATASOURCE_SCHEMA}

      # Security - LDAP

      SECURITY_AUTH_LDAP_DN: ${SECURITY_LDAP_DN}
      SECURITY_AUTH_LDAP_URL: ${SECURITY_LDAP_URL}
      SECURITY_AUTH_LDAP_BASEDN: ${SECURITY_LDAP_BASEDN}
      SECURITY_AUTH_LDAP_SYSTEM_USERNAME: ${SECURITY_LDAP_SYSTEM_USERNAME}
      SECURITY_AUTH_LDAP_SEARCHSTRING: ${SECURITY_LDAP_SEARCHSTRING}
      SECURITY_AUTH_LDAP_SEARCHBASE: ${SECURITY_LDAP_SEARCHBASE}
      SECURITY_AUTH_LDAP_USERMAPPING_DISPLAYNAMEATTR: ${SECURITY_LDAP_USERMAPPING_DISPLAYNAMEATTR}
      SECURITY_AUTH_LDAP_USERMAPPING_FIRSTNAMEATTR: ${SECURITY_LDAP_USERMAPPING_FIRSTNAMEATTR}
      SECURITY_AUTH_LDAP_USERMAPPING_MIDDLENAMEATTR: ${SECURITY_LDAP_USERMAPPING_MIDDLENAMEATTR}
      SECURITY_AUTH_LDAP_USERMAPPING_LASTNAMEATTR: ${SECURITY_LDAP_USERMAPPING_LASTNAMEATTR}
      SECURITY_AUTH_LDAP_USERMAPPING_USERNAMEATTR: ${SECURITY_LDAP_USERMAPPING_USERNAMEATTR}
      SECURITY_AUTH_LDAP_USERIMPORT_USERNAMEATTR: ${SECURITY_LDAP_USERIMPORT_USERNAMEATTR}
      SECURITY_AUTH_LDAP_USERIMPORT_LOGINATTR: ${SECURITY_LDAP_USERIMPORT_LOGINATTR}

      # Security - Active Directory

      SECURITY_AUTH_AD_URL: ${SECURITY_AD_URL}
      SECURITY_AUTH_AD_SEARCHBASE: ${SECURITY_AD_SEARCHBASE}
      SECURITY_AUTH_AD_SEARCHFILTER: ${SECURITY_AD_SEARCHFILTER}
      SECURITY_AUTH_AD_PRINCIPALSUFFIX: ${SECURITY_AD_PRINCIPALSUFFIX}
      SECURITY_AUTH_AD_SEARCHSTRING: ${SECURITY_AD_SEARCHSTRING}
      SECURITY_AUTH_AD_SYSTEM_USERNAME: ${SECURITY_AD_SYSTEM_USERNAME}
      SECURITY_AUTH_AD_IGNORE_PARTIAL_RESULT_EXCEPTION: ${SECURITY_AD_IGNORE_PARTIAL_RESULT_EXCEPTION}
      SECURITY_AUTH_AD_RESULT_COUNT_LIMIT: ${SECURITY_AD_RESULT_COUNT_LIMIT}
      SECURITY_AUTH_AD_DEFAULT_IMPORT_GROUP: ${SECURITY_AD_DEFAULT_IMPORT_GROUP}
      SECURITY_AUTH_AD_USERMAPPING_DISPLAYNAMEATTR: ${SECURITY_AD_USERMAPPING_DISPLAYNAMEATTR}
      SECURITY_AUTH_AD_USERMAPPING_FIRSTNAMEATTR: ${SECURITY_AD_USERMAPPING_FIRSTNAMEATTR}
      SECURITY_AUTH_AD_USERMAPPING_MIDDLENAMEATTR: ${SECURITY_AD_USERMAPPING_MIDDLENAMEATTR}
      SECURITY_AUTH_AD_USERMAPPING_LASTNAMEATTR: ${SECURITY_AD_USERMAPPING_LASTNAMEATTR}
      SECURITY_AUTH_AD_USERMAPPING_USERNAMEATTR: ${SECURITY_AD_USERMAPPING_USERNAMEATTR}
      SECURITY_AUTH_AD_USERIMPORT_LOGINATTR: ${SECURITY_AD_USERIMPORT_LOGINATTR}
      SECURITY_AUTH_AD_USERIMPORT_USERNAMEATTR: ${SECURITY_AD_USERIMPORT_USERNAMEATTR}

      # Security - Kerberos

      SECURITY_AUTH_KERBEROS_SPN: ${SECURITY_KERBEROS_SPN}
      SECURITY_AUTH_KERBEROS_KEYTABPATH: ${SECURITY_KERBEROS_KEYTABPATH}

      # Security - OAuth

      SECURITY_AUTH_OAUTH_CALLBACK_UI: ${SECURITY_OAUTH_CALLBACK_UI}
      SECURITY_AUTH_OAUTH_CALLBACK_API: ${SECURITY_OAUTH_CALLBACK_API}
      SECURITY_AUTH_OAUTH_GOOGLE_APIKEY: ${SECURITY_OAUTH_GOOGLE_APIKEY}
      SECURITY_AUTH_OAUTH_FACEBOOK_APIKEY: ${SECURITY_OAUTH_FACEBOOK_APIKEY}
      SECURITY_AUTH_OAUTH_GITHUB_APIKEY: ${SECURITY_OAUTH_GITHUB_APIKEY}

      # Security - OpenID Connect

      SECURITY_AUTH_OIDC_CLIENTID: ${SECURITY_OID_CLIENTID}
      SECURITY_AUTH_OIDC_APISECRET: ${SECURITY_OID_APISECRET}
      SECURITY_AUTH_OIDC_URL: ${SECURITY_OID_URL}
      SECURITY_AUTH_OIDC_LOGOUTURL: ${SECURITY_OID_LOGOUTURL}
      SECURITY_AUTH_OIDC_EXTRASCOPES: ${SECURITY_OID_EXTRASCOPES}
      SECURITY_AUTH_OIDC_REDIRECTURL: ${SECURITY_OID_REDIRECTURL}
      SECURITY_AUTH_OIDC_CUSTOMPARAMS: ${SECURITY_OID_CUSTOMPARAMS}

      # Security - Google IAP

      SECURITY_AUTH_GOOGLEIAP_CLOUDPROJECTID: ${SECURITY_GOOGLEIAP_CLOUDPROJECTID}
      SECURITY_AUTH_GOOGLEIAP_BACKENDSERVICEID: ${SECURITY_GOOGLEIAP_BACKENDSERVICEID}

      # Security - CAS

      SECURITY_AUTH_CAS_LOGINURL: ${HTTP_TYPE}://${WEBAPI_SECURITY_CAS_SERVER}/idp/profile/cas/login
      SECURITY_AUTH_CAS_CALLBACKURL: ${HTTP_TYPE}://${BROADSEA_HOST}/WebAPI/user/cas/callback?client_name=CasClient
      SECURITY_AUTH_CAS_SERVERURL: ${HTTP_TYPE}://${WEBAPI_SECURITY_CAS_SERVER}/idp/profile/cas
      SECURITY_AUTH_CAS_CASTICKET: ticket

      # Security - SAML

      SECURITY_AUTH_SAML_ENTITYID: ${SECURITY_SAML_ENTITYID}
      SECURITY_AUTH_SAML_IDPMETADATALOCATION: ${SECURITY_SAML_IDPMETADATALOCATION}
      SECURITY_AUTH_SAML_KEYMANAGER_KEYSTOREFILE: ${SECURITY_SAML_KEYMANAGER_KEYSTOREFILE}
      SECURITY_AUTH_SAML_KEYMANAGER_DEFAULTKEY: ${SECURITY_SAML_KEYMANAGER_DEFAULTKEY}
      SECURITY_AUTH_SAML_METADATALOCATION: ${SECURITY_SAML_METADATALOCATION}
      SECURITY_AUTH_SAML_CALLBACKURL: ${SECURITY_SAML_CALLBACKURL}
      SECURITY_AUTH_SAML_SLOURL: ${SECURITY_SAML_SLOURL}
      SECURITY_AUTH_SAML_MAXIMUMAUTHENTICATIONLIFETIME: ${SECURITY_SAML_MAXIMUMAUTHENTICATIONLIFETIME}

      # Atlas cohort caching

      CACHE_GENERATION_INVALIDAFTERDAYS: ${CACHE_GENERATION_INVALIDAFTERDAYS}
      CACHE_GENERATION_CLEANUPINTERVAL: ${CACHE_GENERATION_CLEANUPINTERVAL}

      # Multiple language support

      I18N_ENABLED: ${I18N_ENABLED}

      # Execution engine

      EXECUTIONENGINE_URL: ${EXECUTIONENGINE_URL}
      EXECUTIONENGINE_TOKEN: 
      EXECUTIONENGINE_UPDATESTATUSCALLBACK: "http://ohdsi-webapi:8080/WebAPI/executionservice/callbacks/submission/{id}/status/update/{password}"
      EXECUTIONENGINE_RESULTCALLBACK: "http://ohdsi-webapi:8080/WebAPI/executionservice/callbacks/submission/{id}/result/{password}"
      EXECUTION_INVALIDATION_MAXAGE_HOURS: 72
      EXECUTIONENGINE_RESULTEXCLUSIONS: "*.sqlite,covariates"

      # WebAPI logging levels
      LOGGING_LEVEL_ROOT: ${WEBAPI_LOGGING_LEVEL_ROOT}
      LOGGING_LEVEL_ORG_OHDSI: ${WEBAPI_LOGGING_LEVEL_ORG_OHDSI}

    labels:
      - "traefik.enable=true"
